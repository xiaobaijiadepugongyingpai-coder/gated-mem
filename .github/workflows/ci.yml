name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest coverage pyyaml

      - name: Verify zero third-party runtime dependencies (-S)
        run: |
          python -S -c "import sys; sys.path.insert(0, 'src'); import gated_mem, gated_mem.cli, gated_mem.server, gated_mem.adapters"

      - name: Run unit tests and coverage gate
        run: |
          python -m coverage run --source=src/gated_mem -m pytest tests/ -q
          python -m coverage report --fail-under=89

      - name: Run Gate 3 offline HTML exporter security gate
        run: python -c "import benchmarks.gate3_check as g3; g3.g3_exporter()"

      - name: Verify Phase-5 E3 benchmark (builtin provider)
        run: python benchmarks/eval_phase5_e3.py --provider builtin
