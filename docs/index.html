<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gated-Mem — Interactive Memory Graph Demo</title>
<style>
  :root{
    --bg:#07090e;--bar:#0d1117;--card:#161b22;--border:#262c36;
    --fg:#e6edf3;--muted:#8b949e;--green:#3fb950;--blue:#58a6ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
  .wrap{display:flex;flex-direction:column;height:100vh}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:8px 16px;background:var(--bar);border-bottom:1px solid var(--border);
    flex-wrap:wrap;z-index:10;
  }
  .brand{display:flex;align-items:center;gap:10px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
  .title{font-weight:700;font-size:14px;letter-spacing:.2px}
  .sub{font-size:12px;color:var(--muted)}
  .cmd-box{
    display:flex;align-items:center;gap:8px;background:var(--card);
    border:1px solid var(--border);border-radius:8px;padding:4px 8px;
  }
  .cmd-box code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;color:#79c0ff}
  .btn{
    background:var(--card);color:var(--fg);border:1px solid var(--border);
    border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer;text-decoration:none;
    transition:border-color .15s,color .15s,background .15s;white-space:nowrap;
  }
  .btn:hover{border-color:var(--blue);color:var(--blue)}
  .btn-primary{border-color:rgba(63,185,80,.45);background:rgba(63,185,80,.12);color:var(--green);font-weight:600}
  .btn-primary:hover{border-color:var(--green);background:rgba(63,185,80,.2);color:var(--green)}
  .actions{display:flex;align-items:center;gap:8px}
  iframe{flex:1;width:100%;border:0;background:var(--bg)}
  @media (max-width:860px){.sub,.cmd-box{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span class="title">Gated-Mem</span>
      <span class="sub">Git for Agent Memory · Zero Core Dependencies</span>
    </div>
    <div class="cmd-box">
      <code id="installCmd">pip install "git+https://github.com/xiaobaijiadepugongyingpai-coder/gated-mem.git"</code>
      <button id="copyBtn" class="btn" type="button">Copy</button>
    </div>
    <div class="actions">
      <a class="btn" href="demo_memory_graph.html">Fullscreen Graph</a>
      <a class="btn btn-primary" href="https://github.com/xiaobaijiadepugongyingpai-coder/gated-mem" target="_blank" rel="noopener">★ GitHub Repo</a>
    </div>
  </header>
  <iframe src="demo_memory_graph.html" title="Gated-Mem Interactive Graph Studio"></iframe>
</div>
<script>
(function(){
  var btn = document.getElementById("copyBtn");
  var cmd = document.getElementById("installCmd").textContent;
  btn.addEventListener("click", function(){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(cmd).then(function(){
        btn.textContent = "Copied!";
        setTimeout(function(){ btn.textContent = "Copy"; }, 1800);
      });
    }
  });
})();
</script>
</body>
</html>
